<!DOCTYPE html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* Use same layout and button placement as alexa_login.html */
    .main-container {
      position: absolute;
      top: 5px;
      left: 10px;
      right: 10px;
      bottom: 5px;
      display: flex;
      flex-direction: column;
      background-color: #fff;
    }

    header,
    legend {
      text-align: center;
    }

    .content-wrapper {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      margin-left: 10px;
      margin-right: 10px;
    }

    .homey-button-primary-full {
      margin-top: auto;
      align-self: center;
      margin-bottom: 10px;
    }

    header {
      margin-top: 5px;
    }

    .homey-subtitle {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <header>
      <h1 class="homey-title" data-i18n="pair.choose_plant.title"></h1>
    </header>

    <div class="content-wrapper">
      <main>
        <fieldset class="homey-form-radio-set" role="radiogroup" aria-label="Impianti disponibili">
          <div id="options" class="homey-form-group"></div>
        </fieldset>

        <!-- campo nascosto che conterrà l'id del radio selezionato -->
        <input type="hidden" id="selected-radio-id" name="selected-radio-id" value="">
      </main>

      <button id="confirm-btn" class="homey-button-primary-full" type="button" data-i18n="pair.choose_plant.confirm"></button>
    </div>
  </div>

  <script src="choose_plant.js"></script>
</body>
</html>
